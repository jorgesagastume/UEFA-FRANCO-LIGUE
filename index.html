    // Verificación criptográfica unidireccional del PIN (el PIN nunca existe en el código fuente)
    async function sha256Hex(text) {
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }

    function computeDefaultAuthProof(pinCandidate) {
      const salted = `UFL26:${String(pinCandidate).trim()}`;
      let h1 = 0n;
      let h2 = 0n;
      const p1 = 1000000007n;
      const p2 = 998244353n;
      for (let i = 0; i < salted.length; i++) {
        const code = BigInt(salted.charCodeAt(i));
        h1 = (h1 * 131n + code) % p1;
        h2 = (h2 * 257n + code) % p2;
      }
      h1 = (h1 * h1) % p1;
      h1 = (h1 * h1) % p1;
      h2 = (h2 * h2) % p2;
      return { r1: h1, r2: h2 };
    }

    async function verifyAdminPin(rawPin) {
      const cleanPin = String(rawPin || '').trim();
      if (!cleanPin) return false;
      try {
        const customAuthRaw = localStorage.getItem(STORAGE_ADMIN_AUTH_KEY);
        if (customAuthRaw) {
          const customAuth = JSON.parse(customAuthRaw);
          if (customAuth && customAuth.salt && customAuth.digest && window.crypto && crypto.subtle) {
            const candidateDigest = await sha256Hex(`${customAuth.salt}:${cleanPin}`);
            return candidateDigest === customAuth.digest;
          }
        }
      } catch (err) {
        console.warn('Error verificando credencial personalizada:', err);
      }
      const proof = computeDefaultAuthProof(cleanPin);
      return proof.r1 === 706501521n && proof.r2 === 436757547n;
    }

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    // 4. UTILIDADES, PERSISTENCIA, HISTORIAL Y REVERSIÓN DE CAMBIOS
    // =========================================================================
    function cloneData(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    // Ordena los eventos de un partido cronológicamente por minuto
    function sortEventsChronologically(events) {
      if (!Array.isArray(events)) return [];
      return events
        .map((ev, index) => ({ ev, index }))
        .sort((a, b) => {
          const minA = Number(a.ev.minute) || 0;
          const minB = Number(b.ev.minute) || 0;
          if (minA !== minB) return minA - minB;
          return a.index - b.index;
        })
        .map((item) => item.ev);
    }

    // Valida la coherencia deportiva y cronológica antes de registrar un evento
    function validateEventCoherence(existingEvents, newEvent, context = {}) {
      const events = sortEventsChronologically(existingEvents || []);
      const minute = Number(newEvent.minute);
      if (!Number.isFinite(minute) || minute < 1 || minute > 60) {
        return { valid: false, message: 'El minuto del evento debe estar entre 1 y 60.' };
      }

      const wasSentOffEarlier = (playerId) =>
        playerId &&
        events.some(
          (ev) =>
            ev.type === 'red' &&
            (ev.playerId === playerId || ev.scorerId === playerId) &&
            (Number(ev.minute) || 0) <= minute
        );

      if (newEvent.type === 'goal') {
        if (!newEvent.scorerId) {
          return { valid: false, message: 'Selecciona el jugador que anotó el gol.' };
        }
        const isOwnGoal = newEvent.goalType === 'own_goal';
        if (!isOwnGoal && newEvent.assistId && newEvent.assistId === newEvent.scorerId) {
          return { valid: false, message: 'El goleador y el asistidor no pueden ser el mismo jugador.' };
        }
        if (wasSentOffEarlier(newEvent.scorerId)) {
          return { valid: false, message: 'Coherencia: el jugador ya fue expulsado en un minuto anterior.' };
        }
        if (!isOwnGoal && newEvent.assistId && wasSentOffEarlier(newEvent.assistId)) {
          return { valid: false, message: 'Coherencia: el asistidor ya fue expulsado en un minuto anterior.' };
        }
      } else if (newEvent.type === 'sub') {
        if (!newEvent.playerOutId || !newEvent.playerInId) {
          return { valid: false, message: 'Selecciona tanto el jugador que sale como el que entra.' };
        }
        if (newEvent.playerOutId === newEvent.playerInId) {
          return { valid: false, message: 'Selecciona dos jugadores distintos para realizar el cambio.' };
        }
        if (Array.isArray(context.onCourtIds) && context.onCourtIds.length > 0) {
          if (!context.onCourtIds.includes(newEvent.playerOutId)) {
            return { valid: false, message: 'Coherencia: el jugador que sale no está actualmente en cancha.' };
          }
          if (context.onCourtIds.includes(newEvent.playerInId)) {
            return { valid: false, message: 'Coherencia: el jugador que entra ya se encuentra en cancha.' };
          }
        }
        if (wasSentOffEarlier(newEvent.playerInId)) {
          return { valid: false, message: 'Coherencia: un jugador expulsado no puede ingresar al partido.' };
        }
        const playerIn = getPlayerById(newEvent.playerInId);
        if (playerIn && playerIn.injured) {
          return { valid: false, message: `Coherencia: ${playerIn.name} está registrado como lesionado.` };
        }
      } else if (newEvent.type === 'yellow' || newEvent.type === 'red') {
        if (!newEvent.playerId) {
          return { valid: false, message: 'Selecciona el jugador sancionado.' };
        }
        if (wasSentOffEarlier(newEvent.playerId)) {
          return { valid: false, message: 'Coherencia: el jugador ya recibió tarjeta roja anteriormente.' };
        }
      } else if (newEvent.type === 'injury') {
        if (!newEvent.playerId) {
          return { valid: false, message: 'Selecciona el jugador lesionado.' };
        }
        if (wasSentOffEarlier(newEvent.playerId)) {
          return { valid: false, message: 'Coherencia: el jugador ya había sido expulsado.' };
        }
      }

      return { valid: true };
    }

    // Construye o normaliza los 5 puestos titulares en cancha (slot 0 = Portero, 1..4 = Campo)
    function buildNormalizedSlots(teamId, playersList, existingSlots) {
      const teamPlayers = playersList.filter((p) => p.teamId === teamId);
      const validIds = new Set(teamPlayers.map((p) => p.id));

      if (Array.isArray(existingSlots) && existingSlots.length === 5) {
        return existingSlots.map((id) => (id && validIds.has(id) ? id : null));
      }

      const starters = teamPlayers.filter((p) => p.starter);
      const ordered = [...starters].sort((a, b) => (a.pos === 'POR' ? -1 : b.pos === 'POR' ? 1 : 0));
      const slots = [null, null, null, null, null];
      for (let i = 0; i < 5; i++) {
        slots[i] = ordered[i] ? ordered[i].id : null;
      }
      return slots;
    }

    function syncTeamStarterFlagsFromSlots(teamId, slots) {
      const activeSet = new Set((slots || []).filter(Boolean));
      tournamentData.players.forEach((p) => {
        if (p.teamId === teamId) {
          p.starter = activeSet.has(p.id);
        }
      });
    }

    // Retira al jugador expulsado o lesionado del campo; el puesto queda vacío salvo que sea el portero
    function handlePlayerRemovalFromPitch(teamId, playerId, slotsArray, excludedPlayerIds = []) {
      if (!Array.isArray(slotsArray) || slotsArray.length !== 5) return slotsArray;
      const idx = slotsArray.indexOf(playerId);
      const player = getPlayerById(playerId);
      const isGoalkeeperSlot = idx === 0 || (player && player.pos === 'POR');

      if (idx === -1) return slotsArray;

      if (!isGoalkeeperSlot) {
        // Jugador de campo: sale del campo y el puesto queda vacío (null)
        slotsArray[idx] = null;
        return slotsArray;
      }

      // Si es el portero, su puesto NO queda vacío: se cubre automáticamente con un compañero disponible
      const excluded = new Set([...excludedPlayerIds, playerId]);
      const currentInSlots = new Set(slotsArray.filter(Boolean));
      const teamPlayers = tournamentData.players.filter((p) => p.teamId === teamId);

      // 1) Buscar otro portero disponible en banca
      let replacement = teamPlayers.find(
        (p) => !currentInSlots.has(p.id) && !excluded.has(p.id) && !p.injured && p.pos === 'POR'
      );
      // 2) Si no hay otro portero en banca, buscar cualquier jugador de banca disponible
      if (!replacement) {
        replacement = teamPlayers.find(
          (p) => !currentInSlots.has(p.id) && !excluded.has(p.id) && !p.injured
        );
      }
      if (replacement) {
        slotsArray[0] = replacement.id;
        return slotsArray;
      }
      // 3) Si no queda nadie en banca, mover un jugador de campo al arco y dejar vacío su puesto anterior
      for (let i = 4; i >= 1; i--) {
        if (slotsArray[i]) {
          slotsArray[0] = slotsArray[i];
          slotsArray[i] = null;
          return slotsArray;
        }
      }
      return slotsArray;
    }

    function sanitizeTournamentData(raw) {
      const defaults = getDefaultTournamentData();
      if (!raw || typeof raw !== 'object') return defaults;

      const rawPlayers = Array.isArray(raw.players) && raw.players.length > 0 ? raw.players : defaults.players;
      const players = rawPlayers.map((p) => ({
        ...p,
        baseAssists: typeof p.baseAssists === 'number' ? p.baseAssists : 0,
        injured: Boolean(p.injured),
        injuryReason: typeof p.injuryReason === 'string' ? p.injuryReason : '',
      }));

      const rawTeams = Array.isArray(raw.teams) && raw.teams.length === defaults.teams.length ? raw.teams : defaults.teams;
      const teams = rawTeams.map((t) => ({
        ...t,
        lineupSlots: buildNormalizedSlots(t.id, players, t.lineupSlots),
      }));

      const defaultGoalTypesById = {
        ev_j1_7: 'penalty',
        ev_j2_4: 'penalty',
        ev_j2_5: 'free_kick',
      };

      const rawMatches = Array.isArray(raw.matches) && raw.matches.length > 0 ? raw.matches : defaults.matches;
      const matches = rawMatches.map((m) => {
        const defMatch = defaults.matches.find((dm) => dm.id === m.id);
        const normalizedEvents = sortEventsChronologically(m.events || []).map((ev) => {
          if ((ev.type || 'goal') === 'goal') {
            return {
              ...ev,
              goalType: ev.goalType || defaultGoalTypesById[ev.id] || 'normal',
            };
          }
          return ev;
        });
        return {
          ...m,
          date: defMatch ? defMatch.date : m.date,
          time: defMatch ? defMatch.time : m.time,
          homeFormation: m.homeFormation || null,
          awayFormation: m.awayFormation || null,
          homeLineup: Array.isArray(m.homeLineup) && m.homeLineup.length === 5 ? m.homeLineup : null,
          awayLineup: Array.isArray(m.awayLineup) && m.awayLineup.length === 5 ? m.awayLineup : null,
          events: normalizedEvents,
        };
      });

      const playoffs = raw.playoffs && typeof raw.playoffs === 'object' ? { ...defaults.playoffs, ...raw.playoffs } : defaults.playoffs;
      const liveMatch =
        raw.liveMatch && typeof raw.liveMatch === 'object'
          ? {
              ...raw.liveMatch,
              homeSlots: Array.isArray(raw.liveMatch.homeSlots) && raw.liveMatch.homeSlots.length === 5
                ? raw.liveMatch.homeSlots
                : buildNormalizedSlots(raw.liveMatch.homeId, players, null),
              awaySlots: Array.isArray(raw.liveMatch.awaySlots) && raw.liveMatch.awaySlots.length === 5
                ? raw.liveMatch.awaySlots
                : buildNormalizedSlots(raw.liveMatch.awayId, players, null),
              events: sortEventsChronologically(raw.liveMatch.events || []),
            }
          : null;

      return { teams, players, matches, playoffs, liveMatch };
    }

    function loadInitialState() {
      try {
        const savedCurrent = localStorage.getItem(STORAGE_CURRENT_KEY);
        if (savedCurrent) {
          return sanitizeTournamentData(JSON.parse(savedCurrent));
        }
        const savedPermanent = localStorage.getItem(STORAGE_PERMANENT_KEY);
        if (savedPermanent) {
          const parsed = sanitizeTournamentData(JSON.parse(savedPermanent));
          localStorage.setItem(STORAGE_CURRENT_KEY, JSON.stringify(parsed));
          return parsed;
        }
        const legacyData = localStorage.getItem(STORAGE_LEGACY_KEY);
        if (legacyData) {
          const migrated = sanitizeTournamentData(JSON.parse(legacyData));
          localStorage.setItem(STORAGE_CURRENT_KEY, JSON.stringify(migrated));
          localStorage.setItem(STORAGE_PERMANENT_KEY, JSON.stringify(migrated));
          return migrated;
        }
      } catch (err) {
        console.warn('Recuperando estado por defecto:', err);
      }
      const defaults = getDefaultTournamentData();
      try {
        localStorage.setItem(STORAGE_CURRENT_KEY, JSON.stringify(defaults));
        localStorage.setItem(STORAGE_PERMANENT_KEY, JSON.stringify(defaults));
      } catch (err) {
        console.warn('Almacenamiento local no disponible:', err);
      }
      return defaults;
    }

    let tournamentData = loadInitialState();

    function getHistoryList() {
      try {
        const raw = localStorage.getItem(STORAGE_HISTORY_KEY);
        const list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list : [];
      } catch (err) {
        return [];
      }
    }

    function persistTournamentState(actionLabel = 'Actualización del torneo', recordHistory = true) {
      try {
        localStorage.setItem(STORAGE_CURRENT_KEY, JSON.stringify(tournamentData));
        if (recordHistory) {
          const history = getHistoryList();
          const now = new Date();
          const timestamp = now.toLocaleDateString('es-HN') + ' ' + now.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          history.unshift({
            id: 'snap_' + Date.now(),
            label: actionLabel,
            timestamp,
            data: cloneData(tournamentData),
          });
          localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify(history.slice(0, 25)));
        }
      } catch (err) {
        console.warn('Error al persistir estado:', err);
      }
    }

    function saveAsPermanentState() {
      if (!isAdmin) return;
      try {
        const prevPermanent = localStorage.getItem(STORAGE_PERMANENT_KEY);
        if (prevPermanent) {
          const history = getHistoryList();
          const now = new Date();
          history.unshift({
            id: 'perm_prev_' + Date.now(),
            label: 'Respaldo Permanente Anterior',
            timestamp: now.toLocaleDateString('es-HN') + ' ' + now.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' }),
            data: sanitizeTournamentData(JSON.parse(prevPermanent)),
          });
          localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify(history.slice(0, 25)));
        }
        localStorage.setItem(STORAGE_PERMANENT_KEY, JSON.stringify(tournamentData));
        persistTournamentState('Estado fijado como Cambio Permanente', true);
        showToast('Todos los cambios actuales se guardaron como Cambio Permanente.', 'success');
        renderAdminPanelView();
      } catch (err) {
        showToast('No se pudo guardar el estado permanente.', 'error');
      }
    }

    function undoLastChange() {
      if (!isAdmin) return;
      const history = getHistoryList();
      if (history.length < 2) {
        showToast('No hay cambios anteriores para deshacer.', 'info');
        return;
      }
      history.shift();
      const target = history[0];
      tournamentData = sanitizeTournamentData(cloneData(target.data));
      localStorage.setItem(STORAGE_CURRENT_KEY, JSON.stringify(tournamentData));
      localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify(history));
      showToast(`Revertido a: ${target.label}`, 'success');
      renderApp();
    }

    function revertToPermanentState() {
      if (!isAdmin) return;
      try {
        const rawPerm = localStorage.getItem(STORAGE_PERMANENT_KEY);
        if (!rawPerm) {
          showToast('No se encontró un estado permanente guardado.', 'error');
          return;
        }
        tournamentData = sanitizeTournamentData(JSON.parse(rawPerm));
        persistTournamentState('Reversión a Cambio Permanente Oficial', true);
        showToast('Torneo restaurado al Cambio Permanente guardado.', 'success');
        renderApp();
      } catch (err) {
        showToast('Error al revertir al estado permanente.', 'error');
      }
    }

    function revertToHistorySnapshot(snapId) {
      if (!isAdmin) return;
      const history = getHistoryList();
      const snap = history.find((item) => item.id === snapId);
      if (!snap) return;
      tournamentData = sanitizeTournamentData(cloneData(snap.data));
      persistTournamentState(`Restaurado punto: ${snap.label}`, true);
      showToast(`Restaurado: ${snap.label}`, 'success');
      renderApp();
    }

    function getTeamById(teamId) {
      return (
        tournamentData.teams.find((t) => t.id === teamId) || {
          id: teamId,
          name: 'Equipo',
          shortName: 'Equipo',
          formation: '1-2-1',
        }
      );
    }

    function getPlayerById(playerId) {
      return tournamentData.players.find((p) => p.id === playerId) || null;
    }

    function formatPlayerNumber(num) {
      if (num === null || num === undefined || num === '') return '#-';

    // =========================================================================
    // 5. CÁLCULO DE TABLA DE POSICIONES Y SINCRONIZACIÓN DE ESTADÍSTICAS
    // =========================================================================
    function computeStandings() {
      const statsMap = {};
      tournamentData.teams.forEach((t) => {
        statsMap[t.id] = {
          teamId: t.id,
          name: t.name,
          shortName: t.shortName,
          pj: 0,
          g: 0,
          e: 0,
          p: 0,
          gf: 0,
          gc: 0,
          dg: 0,
          pts: 0,
          cleanSheets: 0,
          form: [],
        };
      });

      tournamentData.matches.forEach((m) => {
        if (!m.played) return;
        const home = statsMap[m.homeId];
        const away = statsMap[m.awayId];
        if (!home || !away) return;

        const hs = Number(m.homeScore) || 0;
        const as = Number(m.awayScore) || 0;

        home.pj += 1;
        away.pj += 1;
        home.gf += hs;
        home.gc += as;
        away.gf += as;
        away.gc += hs;

        if (as === 0) home.cleanSheets += 1;
        if (hs === 0) away.cleanSheets += 1;

        if (hs > as) {
          home.g += 1;
          home.pts += 3;
          home.form.push('G');
          away.p += 1;
          away.pts += 1;
          away.form.push('P');
        } else if (as > hs) {
          away.g += 1;
          away.pts += 3;
          away.form.push('G');
          home.p += 1;
          home.pts += 1;
          home.form.push('P');
        } else {
          home.e += 1;
          away.e += 1;
          home.pts += 2;
          away.pts += 2;
          home.form.push('E');
          away.form.push('E');
        }
      });

      Object.values(statsMap).forEach((s) => {
        s.dg = s.gf - s.gc;
      });

      return Object.values(statsMap).sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.dg !== a.dg) return b.dg - a.dg;
        if (b.gf !== a.gf) return b.gf - a.gf;
        return a.name.localeCompare(b.name);
      });
    }

    function recalculatePlayerStats() {
      tournamentData.players.forEach((p) => {
        p.goals = 0;
        p.assists = Number(p.baseAssists) || 0;
        p.yellowCards = 0;
        p.redCards = 0;
      });

      const allEventLists = [];
      tournamentData.matches.forEach((m) => {
        if (Array.isArray(m.events)) allEventLists.push(m.events);
      });
      if (tournamentData.liveMatch && Array.isArray(tournamentData.liveMatch.events)) {
        const liveInMatches = tournamentData.matches.some((m) => m.id === tournamentData.liveMatch.matchId && m.played);
        if (!liveInMatches) {
          allEventLists.push(tournamentData.liveMatch.events);
        }
      }

      allEventLists.forEach((evList) => {
        evList.forEach((ev) => {
          const evType = ev.type || 'goal';
          if (evType === 'goal') {
            if (ev.goalType !== 'own_goal') {
              const scorer = getPlayerById(ev.scorerId);
              if (scorer) scorer.goals += 1;
              if (ev.assistId) {
                const assister = getPlayerById(ev.assistId);
                if (assister) assister.assists += 1;
              }
            }
          } else if (evType === 'yellow') {
            const p = getPlayerById(ev.playerId || ev.scorerId);
            if (p) p.yellowCards += 1;
          } else if (evType === 'red') {
            const p = getPlayerById(ev.playerId || ev.scorerId);
            if (p) p.redCards += 1;
          }
        });
      });
    }

    // =========================================================================
    // 7. CÁLCULO DE PREMIOS DEL TORNEO Y MVP DEL PARTIDO (REGLAS OFICIALES)
    // =========================================================================
    // MVP = (Goles x 1.5) + (Asistencias x 1.0). MVP de partido suma 0 pts extra. Sin MVP en empate.
    function getTournamentAwards() {
      const standings = computeStandings();
      const teamStatsMap = {};
      standings.forEach((s) => {
        teamStatsMap[s.teamId] = s;
      });

      const rankedPlayers = tournamentData.players.map((p) => {
        const tStat = teamStatsMap[p.teamId] || { g: 0, pj: 0, gc: 0, cleanSheets: 0 };
        const mvpPts = p.goals * 1.5 + p.assists * 1.0;
        return {
          player: p,
          team: getTeamById(p.teamId),
          teamWins: tStat.g,
          mvpPts,
        };
      });

      const activeMvpCandidates = rankedPlayers
        .filter((item) => item.mvpPts > 0)
        .sort((a, b) => {
          if (b.mvpPts !== a.mvpPts) return b.mvpPts - a.mvpPts;
          if (b.player.goals !== a.player.goals) return b.player.goals - a.player.goals;
          if (b.player.assists !== a.player.assists) return b.player.assists - a.player.assists;
          return a.player.name.localeCompare(b.player.name);
        });

      let mvpResult = { status: 'none' };
      if (activeMvpCandidates.length > 0) {
        const topLeader = activeMvpCandidates[0];
        const tiedLeaders = activeMvpCandidates.filter(
          (c) =>
            Math.abs(c.mvpPts - topLeader.mvpPts) < 0.001 ||
            (c.player.goals === topLeader.player.goals && c.player.assists === topLeader.player.assists)
        );
        if (tiedLeaders.length > 1) {
          mvpResult = {
            status: 'tie',
            tiedPlayers: tiedLeaders,
            mvpPts: topLeader.mvpPts,
          };
        } else {
          mvpResult = {
            status: 'winner',
            ...topLeader,
          };
        }
      }

      const scorersSorted = [...rankedPlayers].sort((a, b) => {
        if (b.player.goals !== a.player.goals) return b.player.goals - a.player.goals;
        if (b.player.assists !== a.player.assists) return b.player.assists - a.player.assists;
        if (b.teamWins !== a.teamWins) return b.teamWins - a.teamWins;
        return a.player.name.localeCompare(b.player.name);
      });
      const topGoalsCount = scorersSorted[0]?.player.goals || 0;
      const topScorersTied = topGoalsCount > 0 ? scorersSorted.filter((x) => x.player.goals === topGoalsCount) : [];

      const assistersSorted = [...rankedPlayers].sort((a, b) => {
        if (b.player.assists !== a.player.assists) return b.player.assists - a.player.assists;
        if (b.player.goals !== a.player.goals) return b.player.goals - a.player.goals;
        if (b.teamWins !== a.teamWins) return b.teamWins - a.teamWins;
        return a.player.name.localeCompare(b.player.name);
      });
      const topAssistsCount = assistersSorted[0]?.player.assists || 0;
      const topAssistersTied = topAssistsCount > 0 ? assistersSorted.filter((x) => x.player.assists === topAssistsCount) : [];

      const goalkeepers = tournamentData.players
        .filter((p) => p.pos === 'POR')
        .map((gk) => {
          const tStat = teamStatsMap[gk.teamId] || { pj: 0, gc: 0, cleanSheets: 0, g: 0 };
          const avg = tStat.pj > 0 ? tStat.gc / tStat.pj : 999;
          return {
            player: gk,
            team: getTeamById(gk.teamId),
            pj: tStat.pj,
            gc: tStat.gc,
            cleanSheets: tStat.cleanSheets,
            avg,
          };
        })
        .sort((a, b) => {
          if (a.pj === 0 && b.pj > 0) return 1;
          if (b.pj === 0 && a.pj > 0) return -1;
          if (a.gc !== b.gc) return a.gc - b.gc;
          if (b.cleanSheets !== a.cleanSheets) return b.cleanSheets - a.cleanSheets;
          if (b.pj !== a.pj) return b.pj - a.pj;
          return a.player.name.localeCompare(b.player.name);
        });

      return {
        mvp: mvpResult,
        topScorer: scorersSorted[0] || null,
        topScorersTied,
        topAssister: assistersSorted[0] || null,
        topAssistersTied,
        bestGoalkeeper: goalkeepers[0] || null,
        scorersRanking: scorersSorted.filter((x) => x.player.goals > 0 || x.player.assists > 0),
        goalkeepersRanking: goalkeepers,
      };
    }

    function getMatchMVP(match, options = {}) {
      if (!match) return { status: 'pending' };
      const isLive = Boolean(options.isLive);
      if (!match.played && !isLive) return { status: 'pending' };

      const homeId = match.homeId;
      const awayId = match.awayId;
      if (!homeId || !awayId) return { status: 'pending' };

      const events = Array.isArray(match.events) ? match.events : [];
      const participants = tournamentData.players.filter(
        (p) => p.teamId === homeId || p.teamId === awayId
      );
      if (!participants.length) return { status: 'none' };

      const activeCandidates = participants
        .map((p) => {
          let matchGoals = 0;
          let matchAssists = 0;

          events.forEach((ev) => {
            if ((ev.type || 'goal') === 'goal' && ev.goalType !== 'own_goal') {
              if (ev.scorerId === p.id) matchGoals += 1;
              if (ev.assistId === p.id) matchAssists += 1;
            }
          });

          const mvpPts = matchGoals * 1.5 + matchAssists * 1.0;

          return {
            player: p,
            team: getTeamById(p.teamId),
            matchGoals,
            matchAssists,
            mvpPts,
          };
        })
        .filter((c) => c.mvpPts > 0);

      if (!activeCandidates.length) {
        return { status: 'none' };
      }

      activeCandidates.sort((a, b) => {
        if (b.mvpPts !== a.mvpPts) return b.mvpPts - a.mvpPts;
        if (b.matchGoals !== a.matchGoals) return b.matchGoals - a.matchGoals;
        if (b.matchAssists !== a.matchAssists) return b.matchAssists - a.matchAssists;
        return a.player.name.localeCompare(b.player.name);
      });

      const topCandidate = activeCandidates[0];
      const tiedLeaders = activeCandidates.filter(
        (c) =>
          Math.abs(c.mvpPts - topCandidate.mvpPts) < 0.001 ||
          (c.matchGoals === topCandidate.matchGoals && c.matchAssists === topCandidate.matchAssists)
      );

      if (tiedLeaders.length > 1) {
        return {
          status: 'tie',
          tiedPlayers: tiedLeaders,
          mvpPts: topCandidate.mvpPts,
        };
      }

      return {
        status: 'winner',
        winner: topCandidate,
      };
    }

    function formatTiedNamesList(tiedPlayers) {
      const names = tiedPlayers.map((t) => `${t.player.name} (${formatPlayerNumber(t.player.number)})`);
      if (names.length <= 1) return names[0] || '';
      if (names.length === 2) return `${names[0]} y ${names[1]}`;
      return `${names.slice(0, -1).join(', ')} y ${names[names.length - 1]}`;
    }

    // =========================================================================
    function renderNavigation() {
      const navContainer = document.getElementById('nav-tabs');
      const roleBadge = document.getElementById('role-badge');
      const adminBtnLabel = document.getElementById('admin-btn-label');

      if (roleBadge) {
        if (isAdmin) {
          roleBadge.textContent = 'Admin Activo';
          roleBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-400/35';
        } else {
          roleBadge.textContent = 'Modo Espectador';
          roleBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-white/10 text-blue-100 border border-white/15';
        }
      }

      if (adminBtnLabel) {
        adminBtnLabel.textContent = isAdmin ? 'Admin ON' : 'Admin';
      }

      if (!navContainer) return;

      const tabs = [
        { id: 'standings', label: 'Clasificación' },
        { id: 'matches', label: 'Jornadas' },
        { id: 'stats', label: 'Estadísticas' },
        { id: 'rosters', label: 'Plantillas' },
      ];

      if (isAdmin) {
        tabs.push({ id: 'playoffs', label: 'Playoffs' });
        tabs.push({ id: 'admin', label: 'Panel Admin' });
      }

      navContainer.innerHTML = tabs
        .map((t) => {
          const active = activeTab === t.id;
          return `
            <button
              type="button"
              onclick="switchTab('${t.id}')"
              class="px-3.5 py-2 rounded-xl text-xs font-black tracking-wide transition ${
                active
                  ? 'bg-red-600 text-white shadow-sm'
                  : 'text-blue-100/80 hover:text-white hover:bg-white/10'
              }"
            >
              ${t.label}
            </button>
          `;
        })
        .join('');
    }

    function switchTab(tabId) {
      if ((tabId === 'playoffs' || tabId === 'admin') && !isAdmin) {
        activeTab = 'standings';
      } else {
        activeTab = tabId;
      }
      renderApp();
    }

    // =========================================================================
    // 9. TRANSMISIÓN EN VIVO EN TIEMPO REAL
    // =========================================================================
    function startLiveClockInterval() {
      if (liveClockTimer) clearInterval(liveClockTimer);
      liveClockTimer = setInterval(() => {
        if (!tournamentData.liveMatch || !tournamentData.liveMatch.running) return;
        tournamentData.liveMatch.seconds = (Number(tournamentData.liveMatch.seconds) || 0) + 1;
        const clockEl = document.getElementById('live-clock-display');
        if (clockEl) {
          clockEl.textContent = formatMatchClock(tournamentData.liveMatch.seconds);
        }
      }, 1000);
    }

    function formatMatchClock(totalSeconds) {
      const secs = Math.max(0, Number(totalSeconds) || 0);
      const mm = String(Math.floor(secs / 60)).padStart(2, '0');
      const ss = String(secs % 60).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    function getCurrentLiveMinute() {
      if (!tournamentData.liveMatch) return 1;
      return Math.max(1, Math.floor((Number(tournamentData.liveMatch.seconds) || 0) / 60) + 1);
    }

    function startLiveFromMatch(matchId) {
      if (!isAdmin) return;
      const m = tournamentData.matches.find((item) => item.id === matchId);
      if (!m) return;

      const homeTeam = getTeamById(m.homeId);
      const awayTeam = getTeamById(m.awayId);

      const homeSlots = buildNormalizedSlots(m.homeId, tournamentData.players, m.homeLineup || homeTeam.lineupSlots);
      const awaySlots = buildNormalizedSlots(m.awayId, tournamentData.players, m.awayLineup || awayTeam.lineupSlots);

      tournamentData.liveMatch = {
        matchId: m.id,
        round: m.round,
        homeId: m.homeId,
        awayId: m.awayId,
        homeScore: Number(m.homeScore) || 0,
        awayScore: Number(m.awayScore) || 0,
        seconds: 0,
        running: true,
        homeSlots,
        awaySlots,
        homeOnCourt: homeSlots.filter(Boolean),
        awayOnCourt: awaySlots.filter(Boolean),
        events: cloneData(m.events || []),
      };

      persistTournamentState(`Inicio transmisión en vivo J${m.round}`);
      showToast('Transmisión en vivo iniciada.', 'success');
      renderApp();
    }

    function toggleLiveRunning() {
      if (!isAdmin || !tournamentData.liveMatch) return;
      tournamentData.liveMatch.running = !tournamentData.liveMatch.running;
      persistTournamentState(tournamentData.liveMatch.running ? 'Reanudación reloj en vivo' : 'Pausa reloj en vivo');
      renderLiveBanner();
    }

    function adjustLiveMinutes(delta) {
      if (!isAdmin || !tournamentData.liveMatch) return;
      tournamentData.liveMatch.seconds = Math.max(0, (Number(tournamentData.liveMatch.seconds) || 0) + delta * 60);
      persistTournamentState('Ajuste de reloj en vivo');
      renderLiveBanner();
    }

    function finishLiveMatch() {
      if (!isAdmin || !tournamentData.liveMatch) return;
      const lm = tournamentData.liveMatch;
      const match = tournamentData.matches.find((m) => m.id === lm.matchId);
      if (match) {
        match.homeScore = Number(lm.homeScore) || 0;
        match.awayScore = Number(lm.awayScore) || 0;
        match.played = true;
        match.homeLineup = [...(lm.homeSlots || [])];
        match.awayLineup = [...(lm.awaySlots || [])];
        match.events = cloneData(lm.events || []);
      }
      tournamentData.liveMatch = null;
      persistTournamentState('Finalización y publicación de partido en vivo');
      showToast('Partido finalizado y guardado en la clasificación oficial.', 'success');
      renderApp();
    }

    function cancelLiveMatch() {
      if (!isAdmin || !tournamentData.liveMatch) return;
      tournamentData.liveMatch = null;
      persistTournamentState('Cierre de transmisión en vivo');
      showToast('Transmisión en vivo cerrada.', 'info');
      renderApp();
    }

    function applyTeamSubstitution(teamId, playerOutId, playerInId) {
      const team = getTeamById(teamId);
      if (Array.isArray(team.lineupSlots) && team.lineupSlots.length === 5) {
        const idx = team.lineupSlots.indexOf(playerOutId);
        if (idx !== -1) {
          team.lineupSlots[idx] = playerInId;
        }
        syncTeamStarterFlagsFromSlots(teamId, team.lineupSlots);
      } else {
        const teamPlayers = tournamentData.players.filter((p) => p.teamId === teamId);
        const pOut = teamPlayers.find((p) => p.id === playerOutId);
        const pIn = teamPlayers.find((p) => p.id === playerInId);
        if (pOut) pOut.starter = false;
        if (pIn) pIn.starter = true;
      }

      if (tournamentData.liveMatch) {
        if (tournamentData.liveMatch.homeId === teamId && Array.isArray(tournamentData.liveMatch.homeSlots)) {
          tournamentData.liveMatch.homeSlots = tournamentData.liveMatch.homeSlots.map((id) =>
            id === playerOutId ? playerInId : id
          );
          tournamentData.liveMatch.homeOnCourt = tournamentData.liveMatch.homeSlots.filter(Boolean);
        } else if (tournamentData.liveMatch.awayId === teamId && Array.isArray(tournamentData.liveMatch.awaySlots)) {
          tournamentData.liveMatch.awaySlots = tournamentData.liveMatch.awaySlots.map((id) =>
            id === playerOutId ? playerInId : id
          );
          tournamentData.liveMatch.awayOnCourt = tournamentData.liveMatch.awaySlots.filter(Boolean);
        }
      }
    }

    function openLiveQuickActionModal(actionType) {
      if (!isAdmin || !tournamentData.liveMatch) return;
      const lm = tournamentData.liveMatch;
      const home = getTeamById(lm.homeId);
      const away = getTeamById(lm.awayId);
      const defaultMin = getCurrentLiveMinute();

      const buildTeamOptions = () => `
        <option value="${home.id}">${home.name}</option>
        <option value="${away.id}">${away.name}</option>
      `;

      const buildPlayerOptions = (teamId, includeEmpty = false, emptyLabel = 'Sin asistencia') => {
        const list = tournamentData.players.filter((p) => p.teamId === teamId);
        return (
          (includeEmpty ? `<option value="">${emptyLabel}</option>` : '') +
          list.map((p) => `<option value="${p.id}">${p.name} (${formatPlayerNumber(p.number)})</option>`).join('')
        );
      };

      const buildLiveSubOptions = (teamId) => {
        const teamPlayers = tournamentData.players.filter((p) => p.teamId === teamId);
        const slots =
          teamId === lm.homeId
            ? lm.homeSlots || []
            : teamId === lm.awayId
            ? lm.awaySlots || []
            : [];
        const courtIds = slots.filter(Boolean);

        const onCourtPlayers = courtIds.length
          ? teamPlayers.filter((p) => courtIds.includes(p.id))
          : teamPlayers.filter((p) => p.starter);
        const benchPlayers = teamPlayers.filter((p) => !onCourtPlayers.some((c) => c.id === p.id));

        const outList = onCourtPlayers.length ? onCourtPlayers : teamPlayers;
        const inList = benchPlayers.length ? benchPlayers : teamPlayers;

        return {
          outHTML: outList
            .map((p) => `<option value="${p.id}">${p.name} (${formatPlayerNumber(p.number)}) · En cancha</option>`)
            .join(''),

          showToast(
            cardType === 'red'
              ? 'Tarjeta roja: jugador retirado del campo.'
              : 'Tarjeta amarilla registrada en el partido.',
            'success'
          );
          renderApp();
        });
      } else if (actionType === 'injury') {
        openModal(
          'Registrar Lesión en Vivo',
          `
            <form id="live-injury-form" class="space-y-3">
              <div>
                <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">Equipo</label>
                <select id="li-team" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                  ${buildTeamOptions()}
                </select>
              </div>
              <div class="grid grid-cols-3 gap-2">
                <div class="col-span-2">
                  <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">Jugador Lesionado</label>
                  <select id="li-player" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                    ${buildPlayerOptions(home.id)}
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">Minuto</label>
                  <input id="li-min" type="number" min="1" max="60" value="${defaultMin}" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center text-xs font-black" />
                </div>
              </div>
              <div>
                <label class="block text-[11px] font-black uppercase text-rose-400 mb-1">Razón Médica de la Lesión</label>
                <input
                  id="li-reason"
                  type="text"
                  maxlength="80"
                  placeholder="Ej: Esguince de tobillo, sobrecarga muscular..."
                  class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold"
                />
                <div class="flex flex-wrap gap-1.5 mt-2">
                  ${['Sobrecarga muscular', 'Esguince de tobillo', 'Contusión / Golpe', 'Tirón muscular']
                    .map(
                      (preset) =>
                        `<button type="button" onclick="document.getElementById('li-reason').value='${preset}'" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-rose-500/15 dark:bg-slate-800 text-[10px] font-bold text-slate-600 dark:text-slate-300 transition">${preset}</button>`
                    )
                    .join('')}
                </div>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-black">Cancelar</button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-black">Marcar Lesión</button>
              </div>
            </form>
          `
        );

        document.getElementById('li-team').addEventListener('change', (e) => {
          document.getElementById('li-player').innerHTML = buildPlayerOptions(e.target.value);
        });

        document.getElementById('live-injury-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const teamId = document.getElementById('li-team').value;
          const playerId = document.getElementById('li-player').value;
          const minute = Number(document.getElementById('li-min').value) || defaultMin;
          const reason = (document.getElementById('li-reason').value || '').trim();

          const newEvent = {
            id: 'ev_inj_' + Date.now(),
            type: 'injury',
            teamId,
            minute,
            playerId,
            reason,
          };

          const check = validateEventCoherence(lm.events, newEvent);
          if (!check.valid) {
            showToast(check.message, 'error');
            return;
          }

          const player = getPlayerById(playerId);
          if (player) {
            player.injured = true;
            player.injuryReason = reason;
          }

          // La lesión quita al jugador del campo y el puesto queda vacío salvo que sea el portero
          if (teamId === lm.homeId && Array.isArray(lm.homeSlots)) {
            handlePlayerRemovalFromPitch(teamId, playerId, lm.homeSlots);
            lm.homeOnCourt = lm.homeSlots.filter(Boolean);
          } else if (teamId === lm.awayId && Array.isArray(lm.awaySlots)) {
            handlePlayerRemovalFromPitch(teamId, playerId, lm.awaySlots);
            lm.awayOnCourt = lm.awaySlots.filter(Boolean);
          }

          lm.events.push(newEvent);
          lm.events = sortEventsChronologically(lm.events);

          persistTournamentState(`Lesión registrada en vivo: ${player ? player.name : ''}${reason ? ` (${reason})` : ''}`);
          closeModal();
          showToast('Lesión registrada: jugador retirado del campo.', 'info');
          renderApp();
        });
      }
    }

    function getGoalTypeBadgeText(goalType) {
      if (goalType === 'penalty') return '(Penal)';
      if (goalType === 'free_kick') return '(Tiro libre)';
      if (goalType === 'own_goal') return '(Propia puerta)';
      return '';
    }

    function renderSingleEventLineHTML(ev, darkBanner = false) {
      const evType = ev.type || 'goal';
      const min = `${ev.minute || 1}'`;

      if (evType === 'goal') {
        const scorer = getPlayerById(ev.scorerId);
        const assister = ev.goalType !== 'own_goal' && ev.assistId ? getPlayerById(ev.assistId) : null;
        const typeTag = getGoalTypeBadgeText(ev.goalType);
        return `
          <div class="text-[11px] leading-tight">
            <div class="flex items-center gap-1.5 font-extrabold ${darkBanner ? 'text-white' : 'text-slate-900 dark:text-white'} flex-wrap">
              <span class="text-emerald-500 font-black shrink-0">${min}</span>
              ${getEventIconSVG('goal', 13)}
              <span class="truncate">${scorer ? scorer.name : 'Gol'}</span>
              ${
                typeTag
                  ? `<span class="text-[9.5px] font-black ${
                      ev.goalType === 'own_goal'
                        ? 'text-red-500'
                        : darkBanner
                        ? 'text-red-300'
                        : 'text-red-600 dark:text-red-400'
                    }">${typeTag}</span>`
                  : ''
              }
            </div>
            ${
              assister
                ? `<p class="text-[10px] font-semibold ${darkBanner ? 'text-blue-200/80' : 'text-slate-500 dark:text-slate-400'} pl-5 truncate">Asist: ${assister.name}</p>`
                : ''
            }
          </div>
        `;
      }

      if (evType === 'sub') {
        const pOut = getPlayerById(ev.playerOutId);
        const pIn = getPlayerById(ev.playerInId);
        return `
          <div class="text-[10px] leading-snug font-bold space-y-0.5">
            <div class="flex items-center gap-1">
              <span class="font-black text-sky-400 shrink-0">${min}</span>
              ${getEventIconSVG('subIn', 12)}
              <span class="text-emerald-500 font-extrabold truncate">Entra: ${pIn ? pIn.name : '-'}</span>
            </div>
            <div class="flex items-center gap-1 pl-4">
              ${getEventIconSVG('subOut', 12)}
              <span class="text-rose-500 font-bold truncate">Sale: ${pOut ? pOut.name : '-'}</span>
            </div>
          </div>
        `;
      }

      if (evType === 'yellow' || evType === 'red') {
        const p = getPlayerById(ev.playerId || ev.scorerId);
        return `
          <div class="flex items-center gap-1.5 text-[10px] leading-tight font-bold ${darkBanner ? 'text-amber-200' : 'text-slate-700 dark:text-slate-200'}">
            <span class="font-black text-amber-500 shrink-0">${min}</span>
            ${getEventIconSVG(evType, 12)}
            <span class="truncate">${p ? p.name : 'Jugador'}</span>
          </div>
        `;
      }

      if (evType === 'injury') {
        const p = getPlayerById(ev.playerId);
        return `
          <div class="text-[10px] leading-snug font-bold text-rose-500 dark:text-rose-400">
            <div class="flex items-center gap-1.5">
              <span class="font-black shrink-0">${min}</span>
              ${getEventIconSVG('injury', 12)}
              <span class="truncate">Lesión: ${p ? p.name : 'Jugador'}</span>
            </div>
            ${
              ev.reason
                ? `<p class="pl-5 text-[9.5px] font-semibold ${darkBanner ? 'text-rose-200/80' : 'text-slate-500 dark:text-slate-400'} truncate">Motivo: ${escapeHTML(ev.reason)}</p>`
                : ''
            }
          </div>
        `;
      }

      return '';
    }

    function renderLiveBanner() {

        container.innerHTML = '';
        return;

      const away = getTeamById(lm.awayId);

        const normalizedSlots = Array.isArray(slots) && slots.length === 5

          .map((pid, idx) => {

              return `<span class="px-2 py-0.5 rounded-md border border-dashed border-red-400/60 bg-red-600/15 text-[10px] font-black text-red-200">Puesto Vacío</span>`;

            if (!p) return '';
            return `<span class="px-2 py-0.5 rounded-md bg-white/10 text-[10px] font-bold text-white">${

          })

      const sortedLiveEvents = sortEventsChronologically(lm.events || []);

      container.innerHTML = `

                ${formatMatchClock(lm.seconds)}
              </span>
            </div>

            ${
              isAdmin
                ? `<div class="flex items-center gap-1.5 flex-wrap">
                    <button type="button" onclick="toggleLiveRunning()" class="px-2.5 py-1 rounded-lg bg-white/15 hover:bg-white/25 text-[11px] font-black">
                      ${lm.running ? 'Pausar Reloj' : 'Reanudar'}

                    <button type="button" onclick="adjustLiveMinutes(1)" class="px-2 py-1 rounded-lg bg-white/15 hover:bg-white/25 text-[11px] font-black">+1m</button>

                    <button type="button" onclick="cancelLiveMatch()" class="px-2.5 py-1 rounded-lg bg-red-600/40 hover:bg-red-600/60 text-red-100 text-[11px] font-black">Cerrar</button>

                : ''
            }
          </div>

          <!-- Marcador Central -->
          <div class="grid grid-cols-3 items-center gap-2 text-center py-1">
            <div class="flex flex-col items-center gap-1.5">
              ${getTeamLogoSVG(home.id, 46)}
              <span class="text-xs sm:text-sm font-black leading-tight">${home.name}</span>
            </div>

            <div class="flex items-center justify-center gap-3">
              <span class="text-3xl sm:text-4xl font-black text-white">${lm.homeScore}</span>
              <span class="text-lg font-black text-blue-300">-</span>
              <span class="text-3xl sm:text-4xl font-black text-white">${lm.awayScore}</span>
            </div>

            <div class="flex flex-col items-center gap-1.5">
              ${getTeamLogoSVG(away.id, 46)}
              <span class="text-xs sm:text-sm font-black leading-tight">${away.name}</span>
            </div>
          </div>

          <!-- MVP del Partido en Vivo -->
          ${renderMatchMVPBadgeHTML(lm, 'live')}

          <!-- Quintetos Activos en Cancha -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2 border-t border-white/10">
            <div class="space-y-1">
              <span class="text-[10px] font-black uppercase tracking-wider text-blue-300">En Cancha · ${home.shortName}</span>
              <div class="flex flex-wrap gap-1">${getCourtNames(home.id, lm.homeSlots)}</div>
            </div>
            <div class="space-y-1">
              <span class="text-[10px] font-black uppercase tracking-wider text-blue-300">En Cancha · ${away.shortName}</span>
              <div class="flex flex-wrap gap-1">${getCourtNames(away.id, lm.awaySlots)}</div>

                  <div class="space-y-1 border-l border-white/10 pl-3">${awayEvents.map((e) => renderSingleEventLineHTML(e, true)).join('')}</div>
                </div>`

          ${

                  <button type="button" onclick="openLiveQuickActionModal('goal')" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black">+ Gol</button>

                return `

                    <div class="flex items-center justify-between px-1">
