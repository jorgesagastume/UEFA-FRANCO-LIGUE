                          const home = getTeamById(m.homeId);
                          const away = getTeamById(m.awayId);
                          const sortedMatchEvents = sortEventsChronologically(m.events || []);
                          const homeEvents = sortedMatchEvents.filter((e) => e.teamId === home.id);
                          const awayEvents = sortedMatchEvents.filter((e) => e.teamId === away.id);

                          return `
                            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-4 shadow-sm flex flex-col justify-between gap-3">
                              <div class="flex items-center justify-between text-[11px] font-bold text-slate-400">
                                <span>${m.date} · ${m.time}</span>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${
                                  m.played
                                    ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'
                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-500'
                                }">
                                  ${m.played ? 'Finalizado' : 'Pendiente'}
                                </span>
                              </div>

                              <div class="grid grid-cols-3 items-center gap-2 text-center py-1">
                                <div class="flex flex-col items-center gap-1.5 min-w-0">
                                  ${getTeamLogoSVG(home.id, 38)}
                                  <span class="text-xs font-black text-slate-900 dark:text-white leading-tight line-clamp-2">${home.name}</span>
                                </div>

                                <div class="flex items-center justify-center gap-2">
                                  <span class="text-2xl font-black text-slate-900 dark:text-white">${m.played ? m.homeScore : '-'}</span>
                                  <span class="text-xs font-black text-slate-400">:</span>
                                  <span class="text-2xl font-black text-slate-900 dark:text-white">${m.played ? m.awayScore : '-'}</span>
                                </div>

                                <div class="flex flex-col items-center gap-1.5 min-w-0">
                                  ${getTeamLogoSVG(away.id, 38)}
                                  <span class="text-xs font-black text-slate-900 dark:text-white leading-tight line-clamp-2">${away.name}</span>
                                </div>
                              </div>

                              ${renderMatchMVPBadgeHTML(m, 'card')}

                              ${
                                homeEvents.length || awayEvents.length
                                  ? `<div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 dark:border-slate-800/80">
                                      <div class="space-y-1.5">
                                        ${homeEvents.map((ev) => renderSingleEventLineHTML(ev, false)).join('')}
                                      </div>
                                      <div class="space-y-1.5 border-l border-slate-100 dark:border-slate-800/80 pl-2">
                                        ${awayEvents.map((ev) => renderSingleEventLineHTML(ev, false)).join('')}
                                      </div>
                                    </div>`
                                  : ''
                              }

                              <div class="flex items-center gap-2 pt-2 border-t border-slate-100 dark:border-slate-800 flex-wrap">
                                <button type="button" onclick="openMatchTacticalModal('${m.id}')" class="py-1.5 px-2.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-600 dark:text-emerald-400 text-[11px] font-black transition">
                                  ${isAdmin ? 'Alineación / Pizarra' : 'Pizarra Táctica'}
                                </button>
                                ${
                                  isAdmin
                                    ? `<button type="button" onclick="openMatchEditModal('${m.id}')" class="flex-1 py-1.5 px-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-[11px] font-black text-slate-800 dark:text-white transition">
                                        Editar / Eventos
                                      </button>
                                      <button type="button" onclick="startLiveFromMatch('${m.id}')" class="py-1.5 px-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-[11px] font-black transition">
                                        En Vivo
                                      </button>`
                                    : ''
                                }
                              </div>
                            </div>
                          `;
                        })
                        .join('')}
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // INTERCAMBIO DE POSICIONES Y EDICIÓN DE ALINEACIÓN TÁCTICA (5 PUESTOS)
    // =========================================================================
    function handlePitchSlotClick(contextType, contextId, teamId, slotIndex) {
      if (!isAdmin) return;
      const key = `${contextType}:${contextId}:${teamId}`;

      if (!selectedPitchSwap || selectedPitchSwap.key !== key) {
        selectedPitchSwap = { key, slotIndex };
        if (contextType === 'roster') renderRostersView();
        else if (contextType === 'match') openMatchTacticalModal(contextId);
        return;
      }

      const firstSlot = selectedPitchSwap.slotIndex;
      selectedPitchSwap = null;

      if (firstSlot === slotIndex) {
        if (contextType === 'roster') renderRostersView();
        else if (contextType === 'match') openMatchTacticalModal(contextId);
        return;
      }

      if (contextType === 'roster') {
        const team = getTeamById(teamId);
        team.lineupSlots = buildNormalizedSlots(team.id, tournamentData.players, team.lineupSlots);
        const temp = team.lineupSlots[firstSlot];
        team.lineupSlots[firstSlot] = team.lineupSlots[slotIndex];
        team.lineupSlots[slotIndex] = temp;
        syncTeamStarterFlagsFromSlots(team.id, team.lineupSlots);
        persistTournamentState(`Intercambio de posiciones en ${team.shortName}`);
        showToast('Posiciones intercambiadas en la cancha.', 'success');
        renderRostersView();
      } else if (contextType === 'match') {
        const m = tournamentData.matches.find((item) => item.id === contextId);
        if (!m) return;
        const team = getTeamById(teamId);
        const isHome = m.homeId === teamId;
        const slots = buildNormalizedSlots(
          teamId,
          tournamentData.players,
          isHome ? m.homeLineup || team.lineupSlots : m.awayLineup || team.lineupSlots
        );
        const temp = slots[firstSlot];
        slots[firstSlot] = slots[slotIndex];
        slots[slotIndex] = temp;
        if (isHome) m.homeLineup = slots;
        else m.awayLineup = slots;
        persistTournamentState(`Ajuste de alineación J${m.round} (${team.shortName})`);
        showToast('Posiciones intercambiadas en la alineación del partido.', 'success');
        openMatchTacticalModal(contextId);
      }
    }

    function assignPlayerToPitchSlot(contextType, contextId, teamId, slotIndex, newPlayerId) {
      if (!isAdmin) return;

      const applySwapOrAssign = (slots) => {
        const existingSlot = slots.indexOf(newPlayerId);
        if (existingSlot !== -1 && existingSlot !== slotIndex) {
          // Si ya está en la cancha en el puesto de otro, los dos cambian de posición
          const temp = slots[slotIndex];
          slots[slotIndex] = newPlayerId;
          slots[existingSlot] = temp;
        } else {
          slots[slotIndex] = newPlayerId || null;
        }
        return slots;
      };

      if (contextType === 'roster') {
        const team = getTeamById(teamId);
        team.lineupSlots = applySwapOrAssign(buildNormalizedSlots(teamId, tournamentData.players, team.lineupSlots));
        syncTeamStarterFlagsFromSlots(teamId, team.lineupSlots);
        persistTournamentState(`Actualización de alineación en ${team.shortName}`);
        showToast('Alineación actualizada.', 'success');
        renderRostersView();
      } else if (contextType === 'match') {
        const m = tournamentData.matches.find((item) => item.id === contextId);
        if (!m) return;
        const team = getTeamById(teamId);
        const isHome = m.homeId === teamId;
        const slots = applySwapOrAssign(
          buildNormalizedSlots(
            teamId,
            tournamentData.players,
            isHome ? m.homeLineup || team.lineupSlots : m.awayLineup || team.lineupSlots
          )
        );
        if (isHome) m.homeLineup = slots;
        else m.awayLineup = slots;
        persistTournamentState(`Alineación pre-partido J${m.round} (${team.shortName})`);
        showToast('Alineación del partido actualizada.', 'success');
        openMatchTacticalModal(contextId);
      }
    }

    function openMatchTacticalModal(matchId) {
      const m = tournamentData.matches.find((item) => item.id === matchId);
      if (!m) return;

      const renderMiniPitch = (teamId, isHome) => {
        const team = getTeamById(teamId);
        const players = tournamentData.players.filter((p) => p.teamId === team.id);
        const slots = buildNormalizedSlots(
          team.id,
          tournamentData.players,
          isHome ? m.homeLineup || team.lineupSlots : m.awayLineup || team.lineupSlots
        );
        const activeFormation = (isHome ? m.homeFormation : m.awayFormation) || team.formation;
        const formationKey = FORMATIONS[activeFormation] ? activeFormation : '1-2-1';
        const coords = FORMATIONS[formationKey];
        const swapKey = `match:${m.id}:${team.id}`;

        return `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                ${getTeamLogoSVG(team.id, 24)}
                <span class="text-xs font-black truncate">${team.shortName}</span>
              </div>
              ${
                isAdmin
                  ? `<select onchange="changeMatchFormation('${m.id}', '${team.id}', this.value)" class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-[11px] font-black">
                      ${Object.keys(FORMATIONS)
                        .map((f) => `<option value="${f}" ${f === formationKey ? 'selected' : ''}>${f}</option>`)
                        .join('')}
                    </select>`
                  : `<span class="text-[11px] font-black text-emerald-500">${formationKey}</span>`
              }
            </div>
            <div class="relative w-full aspect-[3/4] rounded-xl bg-gradient-to-b from-emerald-700 via-emerald-600 to-emerald-700 border border-white/40 overflow-hidden">
              <div class="absolute inset-2 border border-white/50 rounded-lg pointer-events-none"></div>
              <div class="absolute left-2 right-2 top-1/2 h-0.5 bg-white/50 pointer-events-none"></div>
              <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full border border-white/50 pointer-events-none"></div>
              ${coords
                .map((slot, i) => {
                  const pid = slots[i];
                  const p = pid ? getPlayerById(pid) : null;
                  const isSelected = selectedPitchSwap && selectedPitchSwap.key === swapKey && selectedPitchSwap.slotIndex === i;

                  if (!p) {
                    return `
                      <button
                        type="button"
                        ${isAdmin ? `onclick="handlePitchSlotClick('match', '${m.id}', '${team.id}', ${i})"` : 'disabled'}
                        style="left: ${slot.x}%; top: ${slot.y}%;"
                        class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center text-center w-20 group"
                      >
                        <div class="w-7 h-7 rounded-full border-2 border-dashed ${
                          isSelected ? 'border-red-500 bg-red-600/40 scale-110' : 'border-white/75 bg-slate-950/50'
                        } flex items-center justify-center font-black text-[9px] text-white transition">
                          —
                        </div>
                        <span class="mt-0.5 px-1.5 py-0.5 rounded bg-slate-950/80 text-slate-200 text-[8.5px] font-bold">
                          Vacío (${slot.label})
                        </span>
                      </button>
                    `;
                  }

                  return `
                    <button
                      type="button"
                      ${isAdmin ? `onclick="handlePitchSlotClick('match', '${m.id}', '${team.id}', ${i})"` : 'disabled'}
                      style="left: ${slot.x}%; top: ${slot.y}%;"
                      class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center text-center w-20"
                    >
                      <div class="w-7 h-7 rounded-full ${
                        i === 0 ? 'bg-red-600 text-white' : 'bg-slate-950 text-white'
                      } border-2 ${
                        isSelected ? 'border-yellow-300 ring-4 ring-red-500/70 scale-110' : 'border-white'
                      } flex items-center justify-center font-black text-[10px] shadow transition">
                        ${p.number}
                      </div>
                      <span class="mt-0.5 px-1.5 py-0.5 rounded bg-slate-950/85 text-white text-[9px] font-extrabold truncate max-w-full">
                        ${p.name.split(' ')[0]}
                      </span>
                    </button>
                  `;
                })
                .join('')}
            </div>

            ${
              isAdmin
                ? `<div class="space-y-1.5 pt-1">
                    <p class="text-[10px] font-bold text-slate-400">
                      Toca dos puestos en la cancha para intercambiarlos o elige jugador por puesto:
                    </p>
                    <div class="grid grid-cols-1 gap-1">
                      ${coords
                        .map(
                          (slot, idx) => `
                        <div class="flex items-center gap-1.5 text-[11px]">
                          <span class="w-9 font-black text-slate-400 shrink-0">${slot.label}:</span>
                          <select
                            onchange="assignPlayerToPitchSlot('match', '${m.id}', '${team.id}', ${idx}, this.value)"
                            class="flex-1 px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-[11px] font-bold"
                          >
                            <option value="">-- Puesto Vacío --</option>
                            ${players
                              .map(
                                (pl) =>
                                  `<option value="${pl.id}" ${slots[idx] === pl.id ? 'selected' : ''}>${pl.name} (${formatPlayerNumber(pl.number)})</option>`
                              )
                              .join('')}
                          </select>
                        </div>
                      `
                        )
                        .join('')}
                    </div>
                  </div>`
                : ''
            }
          </div>
        `;
      };

      const home = getTeamById(m.homeId);
      const away = getTeamById(m.awayId);
      openModal(
        `Alineación y Pizarra Táctica · ${home.shortName} vs ${away.shortName}`,
        `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${renderMiniPitch(home.id, true)}
            ${renderMiniPitch(away.id, false)}
          </div>
        `
      );
    }

    function changeMatchFormation(matchId, teamId, newFormation) {
      if (!isAdmin || !FORMATIONS[newFormation]) return;
      const m = tournamentData.matches.find((item) => item.id === matchId);
      if (!m) return;
      if (m.homeId === teamId) m.homeFormation = newFormation;
      else if (m.awayId === teamId) m.awayFormation = newFormation;
      persistTournamentState(`Cambio de esquema táctico en J${m.round}`);
      openMatchTacticalModal(matchId);
    }

    function openMatchEditModal(matchId) {
      if (!isAdmin) return;
      const m = tournamentData.matches.find((item) => item.id === matchId);
      if (!m) return;
      m.events = sortEventsChronologically(m.events || []);
      const home = getTeamById(m.homeId);
      const away = getTeamById(m.awayId);

      const buildPlayerOptions = (teamId, includeEmpty = false, roleFilter = 'all') => {
        const allTeamPlayers = tournamentData.players.filter((p) => p.teamId === teamId);
        let list = allTeamPlayers;
        if (roleFilter === 'starters') {
          const starters = allTeamPlayers.filter((p) => p.starter);
          if (starters.length) list = starters;
        } else if (roleFilter === 'bench') {
          const bench = allTeamPlayers.filter((p) => !p.starter);
          if (bench.length) list = bench;
        }
        return (
          (includeEmpty ? `<option value="">Sin asistencia</option>` : '') +
          list
            .map(
              (p) =>
                `<option value="${p.id}">${p.name} (${formatPlayerNumber(p.number)})${
                  p.injured ? ' · [Lesionado]' : ''
                }</option>`
            )
            .join('')
        );
      };

      const eventsHTML = m.events
        .map((ev, idx) => {
          const team = getTeamById(ev.teamId);
          return `
            <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 text-xs">
              <div class="min-w-0">
                <span class="text-[10px] font-black uppercase text-red-600 dark:text-red-400">${team.shortName}</span>
                ${renderSingleEventLineHTML(ev, false)}
              </div>
              <button type="button" onclick="removeMatchEvent('${m.id}', ${idx})" class="px-2 py-1 rounded-lg bg-red-600/15 hover:bg-red-600/25 text-red-600 dark:text-red-400 text-[10px] font-black shrink-0">
                Eliminar
              </button>
            </div>
          `;
        })
        .join('');

      openModal(
        `Editar Partido · J${m.round}: ${home.shortName} vs ${away.shortName}`,
        `
          <div class="space-y-4">
            <form id="edit-match-score-form" class="space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">${home.shortName}</label>
                  <input id="em-home-score" type="number" min="0" value="${m.homeScore}" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-sm" />
                </div>
                <div>
                  <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">${away.shortName}</label>
                  <input id="em-away-score" type="number" min="0" value="${m.awayScore}" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-sm" />
                </div>
              </div>
              <label class="flex items-center gap-2 text-xs font-bold">
                <input id="em-played" type="checkbox" ${m.played ? 'checked' : ''} class="rounded" />
                <span>Marcar partido como Finalizado (cuenta en la tabla)</span>
              </label>
              <button type="submit" class="w-full py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-black">
                Guardar Marcador y Estado
              </button>
            </form>

            <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2.5">
              <h4 class="text-xs font-black uppercase tracking-wider text-slate-400">Añadir Gol, Cambio, Tarjeta o Lesión (Orden Cronológico)</h4>
              <form id="add-post-event-form" class="space-y-2.5">
                <div class="grid grid-cols-2 gap-2">
                  <select id="pe-type" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                    <option value="goal">Gol y Asistencia</option>
                    <option value="sub">Cambio / Sustitución</option>
                    <option value="yellow">Tarjeta Amarilla</option>
                    <option value="red">Tarjeta Roja</option>
                    <option value="injury">Lesión</option>
                  </select>
                  <select id="pe-team" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                    <option value="${home.id}">${home.shortName}</option>
                    <option value="${away.id}">${away.shortName}</option>
                  </select>
                </div>

                <div id="pe-goal-type-wrapper">
                  <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Modalidad del Gol</label>
                  <select id="pe-goal-type" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                    <option value="normal">Normal</option>
                    <option value="penalty">Penal</option>
                    <option value="free_kick">Tiro libre</option>
                    <option value="own_goal">Propia puerta</option>
                  </select>
                </div>

                <div class="grid grid-cols-3 gap-2 items-end">
                  <div>
                    <label id="pe-p1-label" class="block text-[10px] font-black uppercase text-slate-400 mb-1">Goleador</label>
                    <select id="pe-p1" class="w-full px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                      ${buildPlayerOptions(home.id, false)}
                    </select>
                  </div>
                  <div id="pe-p2-wrapper">
                    <label id="pe-p2-label" class="block text-[10px] font-black uppercase text-slate-400 mb-1">Asistencia</label>
                    <select id="pe-p2" class="w-full px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                      ${buildPlayerOptions(home.id, true)}
                    </select>
                  </div>
                  <div>
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Minuto</label>
                    <input id="pe-min" type="number" min="1" max="60" value="10" placeholder="Min" class="w-full px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center text-xs font-black" />
                  </div>
                </div>

                <div id="pe-reason-wrapper" class="hidden">
                  <input
                    id="pe-reason"
                    type="text"
                    maxlength="80"
                    placeholder="Razón médica de la lesión (Ej: Esguince de tobillo, sobrecarga...)"
                    class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold"
                  />
                </div>

                <button type="submit" class="w-full py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black">
                  Agregar Evento al Partido
                </button>
              </form>
            </div>

            <div class="space-y-1.5">
              <h4 class="text-xs font-black uppercase tracking-wider text-slate-400">Eventos Registrados (${m.events.length})</h4>
              ${eventsHTML || `<p class="text-xs text-slate-400">Sin eventos registrados.</p>`}
            </div>
          </div>
        `
      );

      const refreshPlayersSelect = () => {
        const tid = document.getElementById('pe-team').value;
        const type = document.getElementById('pe-type').value;
        const gType = document.getElementById('pe-goal-type').value;
        const otherTeamId = tid === home.id ? away.id : home.id;

        const p1Label = document.getElementById('pe-p1-label');
        const p2Label = document.getElementById('pe-p2-label');
        const p2Wrap = document.getElementById('pe-p2-wrapper');
        const goalTypeWrap = document.getElementById('pe-goal-type-wrapper');
        const reasonWrap = document.getElementById('pe-reason-wrapper');

        if (type === 'goal') {
          goalTypeWrap.classList.remove('hidden');
          if (gType === 'own_goal') {
            p1Label.textContent = 'Propia puerta';
            document.getElementById('pe-p1').innerHTML = buildPlayerOptions(otherTeamId, false, 'all');
            p2Wrap.classList.add('hidden');
          } else {
            p1Label.textContent = 'Goleador';
            p2Label.textContent = 'Asistencia';
            document.getElementById('pe-p1').innerHTML = buildPlayerOptions(tid, false, 'all');
            document.getElementById('pe-p2').innerHTML = buildPlayerOptions(tid, true, 'all');
            p2Wrap.classList.remove('hidden');
          }
        } else if (type === 'sub') {
          goalTypeWrap.classList.add('hidden');
          p1Label.textContent = 'Sale (Cancha)';
          p2Label.textContent = 'Entra (Banca)';
          document.getElementById('pe-p1').innerHTML = buildPlayerOptions(tid, false, 'starters');
          document.getElementById('pe-p2').innerHTML = buildPlayerOptions(tid, false, 'bench');
          p2Wrap.classList.remove('hidden');
        } else {
          goalTypeWrap.classList.add('hidden');
          p1Label.textContent = type === 'injury' ? 'Lesionado' : 'Jugador';
          document.getElementById('pe-p1').innerHTML = buildPlayerOptions(tid, false, 'all');
          p2Wrap.classList.add('hidden');
        }

        if (type === 'injury') {
          reasonWrap.classList.remove('hidden');
        } else {
          reasonWrap.classList.add('hidden');
        }
      };

      document.getElementById('pe-team').addEventListener('change', refreshPlayersSelect);
      document.getElementById('pe-type').addEventListener('change', refreshPlayersSelect);
      document.getElementById('pe-goal-type').addEventListener('change', refreshPlayersSelect);

      document.getElementById('edit-match-score-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const newHomeScore = Number(document.getElementById('em-home-score').value) || 0;
        const newAwayScore = Number(document.getElementById('em-away-score').value) || 0;
        const homeGoalEvents = (m.events || []).filter((ev) => (ev.type || 'goal') === 'goal' && ev.teamId === m.homeId).length;
        const awayGoalEvents = (m.events || []).filter((ev) => (ev.type || 'goal') === 'goal' && ev.teamId === m.awayId).length;

        if (newHomeScore < homeGoalEvents || newAwayScore < awayGoalEvents) {
          showToast(
            `Coherencia: el marcador no puede ser menor a los goles registrados (${homeGoalEvents}-${awayGoalEvents}).`,
            'error'
          );
          return;
        }

        m.homeScore = newHomeScore;
        m.awayScore = newAwayScore;
        m.played = document.getElementById('em-played').checked;
        persistTournamentState(`Edición de marcador J${m.round}`);
        showToast('Marcador actualizado.', 'success');
        renderApp();
        openMatchEditModal(m.id);
      });

      document.getElementById('add-post-event-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const type = document.getElementById('pe-type').value;
        const teamId = document.getElementById('pe-team').value;
        const goalType = document.getElementById('pe-goal-type').value;
        const p1 = document.getElementById('pe-p1').value;
        const p2 = document.getElementById('pe-p2').value;
        const minute = Number(document.getElementById('pe-min').value) || 1;
        const reason = (document.getElementById('pe-reason')?.value || '').trim();

        if (!Array.isArray(m.events)) m.events = [];

        let newEvent = null;
        if (type === 'goal') {
          newEvent = {
            id: 'ev_' + Date.now(),
            type: 'goal',
            goalType,
            teamId,
            minute,
            scorerId: p1,
            assistId: goalType === 'own_goal' || p2 === p1 ? '' : p2,
          };
        } else if (type === 'sub') {
          newEvent = {
            id: 'ev_' + Date.now(),
            type: 'sub',
            teamId,
            minute,
            playerOutId: p1,
            playerInId: p2,
          };
        } else if (type === 'yellow' || type === 'red') {
          newEvent = {
            id: 'ev_' + Date.now(),
            type,
            teamId,
            minute,
            playerId: p1,
          };
        } else if (type === 'injury') {
          newEvent = {
            id: 'ev_' + Date.now(),
            type: 'injury',
            teamId,
            minute,
            playerId: p1,
            reason,
          };
        }

        const check = validateEventCoherence(m.events, newEvent);
        if (!check.valid) {
          showToast(check.message, 'error');
          return;
        }

        if (type === 'goal') {
          if (teamId === m.homeId) {
            m.homeScore = (Number(m.homeScore) || 0) + 1;
          } else {
            m.awayScore = (Number(m.awayScore) || 0) + 1;
          }
        } else if (type === 'sub') {
          applyTeamSubstitution(teamId, p1, p2);
        } else if (type === 'red') {
          const team = getTeamById(teamId);
          const isHome = m.homeId === teamId;
          const slots = buildNormalizedSlots(
            teamId,
            tournamentData.players,
            isHome ? m.homeLineup || team.lineupSlots : m.awayLineup || team.lineupSlots
          );
          handlePlayerRemovalFromPitch(teamId, p1, slots);
          if (isHome) m.homeLineup = slots;
          else m.awayLineup = slots;
        } else if (type === 'injury') {
          const pl = getPlayerById(p1);
          if (pl) {
            pl.injured = true;
            pl.injuryReason = reason;
          }
          const team = getTeamById(teamId);
          const isHome = m.homeId === teamId;
          const slots = buildNormalizedSlots(
            teamId,
            tournamentData.players,
            isHome ? m.homeLineup || team.lineupSlots : m.awayLineup || team.lineupSlots
          );
          handlePlayerRemovalFromPitch(teamId, p1, slots);
          if (isHome) m.homeLineup = slots;
          else m.awayLineup = slots;
        }

        m.events.push(newEvent);
        m.events = sortEventsChronologically(m.events);

        persistTournamentState(`Nuevo evento post-partido J${m.round}`);
        showToast('Evento agregado en orden cronológico.', 'success');
        renderApp();
        openMatchEditModal(m.id);
      });
    }

    function removeMatchEvent(matchId, eventIndex) {
      if (!isAdmin) return;
      const m = tournamentData.matches.find((item) => item.id === matchId);
      if (!m || !Array.isArray(m.events)) return;
      m.events = sortEventsChronologically(m.events);
      const [removed] = m.events.splice(eventIndex, 1);

      if (removed && (removed.type || 'goal') === 'goal') {
        if (removed.teamId === m.homeId) {
          m.homeScore = Math.max(0, (Number(m.homeScore) || 0) - 1);
        } else if (removed.teamId === m.awayId) {
          m.awayScore = Math.max(0, (Number(m.awayScore) || 0) - 1);
        }
      }

      persistTournamentState(`Eliminación de evento J${m.round}`);
      showToast('Evento eliminado.', 'info');
      renderApp();
      openMatchEditModal(m.id);
    }

      selectedRoundFilter = roundVal;
      renderMatchesView();

                    <h3 class="text-sm font-black text-slate-900 dark:text-white">${team.name}</h3>
                    <span class="text-[11px] font-bold text-emerald-500">Esquema ${formationKey}</span>
                  </div>
                </div>

                ${
                  isAdmin
                    ? `<select onchange="changeTeamFormation('${team.id}', this.value)" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-black">
                        ${Object.keys(FORMATIONS)
                          .map((f) => `<option value="${f}" ${f === formationKey ? 'selected' : ''}>${f}</option>`)
                          .join('')}
                      </select>`
                    : ''
                }
              </div>

              <div class="relative w-full aspect-[3/4] rounded-2xl bg-gradient-to-b from-emerald-700 via-emerald-600 to-emerald-700 border-2 border-white/40 overflow-hidden shadow-inner">
                <div class="absolute inset-3 border-2 border-white/50 rounded-xl pointer-events-none"></div>
                <div class="absolute left-3 right-3 top-1/2 h-0.5 bg-white/50 pointer-events-none"></div>
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full border-2 border-white/50 pointer-events-none"></div>
                <div class="absolute left-1/2 top-3 -translate-x-1/2 w-28 h-12 border-b-2 border-x-2 border-white/50 rounded-b-2xl pointer-events-none"></div>
                <div class="absolute left-1/2 bottom-3 -translate-x-1/2 w-28 h-12 border-t-2 border-x-2 border-white/50 rounded-t-2xl pointer-events-none"></div>

                ${coords
                  .map((slot, i) => {
                    const pid = team.lineupSlots[i];
                    const p = pid ? getPlayerById(pid) : null;
                    const isSelected = selectedPitchSwap && selectedPitchSwap.key === swapKey && selectedPitchSwap.slotIndex === i;

                    if (!p) {
                      return `
                        <button
                          type="button"
                          ${isAdmin ? `onclick="handlePitchSlotClick('roster', 'main', '${team.id}', ${i})"` : 'disabled'}
                          style="left: ${slot.x}%; top: ${slot.y}%;"
                          class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center text-center w-24"
                        >
                          <div class="w-9 h-9 rounded-full border-2 border-dashed ${
                            isSelected ? 'border-yellow-300 bg-red-600/40 scale-110' : 'border-white/75 bg-slate-950/50'
                          } shadow-lg flex items-center justify-center font-black text-xs text-white transition">
                            —
                          </div>
                          <span class="mt-1 px-2 py-0.5 rounded-md bg-slate-950/80 text-slate-200 text-[9.5px] font-bold">
                            Vacío (${slot.label})
                          </span>
                        </button>
                      `;
                    }

                    return `
                      <button
                        type="button"
                        ${isAdmin ? `onclick="handlePitchSlotClick('roster', 'main', '${team.id}', ${i})"` : 'disabled'}
                        style="left: ${slot.x}%; top: ${slot.y}%;"
                        class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center text-center w-24"
                      >
                        <div class="w-9 h-9 rounded-full ${
                          i === 0 ? 'bg-red-600 text-white' : 'bg-slate-950 text-white'
                        } border-2 ${
                          isSelected ? 'border-yellow-300 ring-4 ring-red-500/75 scale-110' : 'border-white'
                        } shadow-lg flex items-center justify-center font-black text-xs transition">
                          ${p.number}
                        </div>
                        <span class="mt-1 px-2 py-0.5 rounded-md bg-slate-950/85 text-white text-[10px] font-extrabold truncate max-w-full shadow">
                          ${p.name.split(' ')[0]} ${p.captain ? '(C)' : ''}
                        </span>
                      </button>
                    `;
                  })
                  .join('')}
              </div>

              ${
                isAdmin
                  ? `<div class="space-y-1.5 pt-1">
                      <p class="text-[10px] font-bold text-slate-400">
                        Toca dos puestos en la cancha para intercambiarlos o asigna cada posición:
                      </p>
                      <div class="grid grid-cols-1 gap-1">
                        ${coords
                          .map(
                            (slot, idx) => `
                          <div class="flex items-center gap-1.5 text-[11px]">
                            <span class="w-10 font-black text-slate-400 shrink-0">${slot.label}:</span>
                            <select
                              onchange="assignPlayerToPitchSlot('roster', 'main', '${team.id}', ${idx}, this.value)"
                              class="flex-1 px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-[11px] font-bold"
                            >
                              <option value="">-- Puesto Vacío --</option>
                              ${teamPlayers
                                .map(
                                  (pl) =>
                                    `<option value="${pl.id}" ${team.lineupSlots[idx] === pl.id ? 'selected' : ''}>${pl.name} (${formatPlayerNumber(pl.number)})</option>`
                                )
                                .join('')}
                            </select>
                          </div>
                        `
                          )
                          .join('')}
                      </div>
                    </div>`
                  : ''
              }
            </div>

            <!-- Lista Completa de Plantilla -->
            <div class="lg:col-span-7 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">
              <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h3 class="text-sm font-black text-slate-900 dark:text-white">Convocatoria Oficial (${teamPlayers.length} Jugadores)</h3>
                <span class="text-[11px] font-bold text-slate-400">${activeStartersCount} En Cancha · ${bench.length} Banca</span>
              </div>

              <div class="divide-y divide-slate-100 dark:divide-slate-800/80">
                ${teamPlayers
                  .map((p) => {
                    const slotIdx = team.lineupSlots.indexOf(p.id);
                    const onCourt = slotIdx !== -1;
                    return `
                      <div class="px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
                        <div class="flex items-center gap-3 min-w-0">
                          <span class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 flex items-center justify-center font-black text-xs text-red-600 dark:text-red-400 shrink-0">
                            ${formatPlayerNumber(p.number)}
                          </span>
                          <div class="min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                              <span class="text-xs sm:text-sm font-black text-slate-900 dark:text-white truncate">${p.name}</span>
                              ${
                                p.captain
                                  ? `<span class="px-1.5 py-0.5 rounded bg-red-600 text-white text-[9px] font-black">CAPITÁN</span>`
                                  : ''
                              }
                              ${
                                p.pos === 'POR'
                                  ? `<span class="px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-500 text-[9px] font-black">PORTERO</span>`
                                  : `<span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 text-[9px] font-black">${p.pos}</span>`
                              }
                              ${
                                p.injured
                                  ? `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-red-600/20 text-red-600 dark:text-red-400 text-[9px] font-black">${getEventIconSVG('injury', 10)} LESIONADO${p.injuryReason ? `: ${escapeHTML(p.injuryReason).toUpperCase()}` : ''}</span>`
                                  : ''
                              }
                            </div>
                            <p class="text-[11px] font-bold text-slate-400 mt-0.5 flex items-center gap-1.5 flex-wrap">
                              <span>${p.goals} Goles · ${p.assists} Asistencias</span>
                              ${p.yellowCards ? `<span class="inline-flex items-center gap-0.5 text-yellow-500">· ${getEventIconSVG('yellow', 11)} ${p.yellowCards}</span>` : ''}
                              ${p.redCards ? `<span class="inline-flex items-center gap-0.5 text-red-600">· ${getEventIconSVG('red', 11)} ${p.redCards}</span>` : ''}
                            </p>
                          </div>
                        </div>

                        <div class="flex items-center gap-1.5 shrink-0">
                          <span class="px-2 py-1 rounded-lg text-[10px] font-black ${
                            onCourt
                              ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400'
                              : 'bg-slate-100 dark:bg-slate-800 text-slate-500'
                          }">
                            ${onCourt ? `Titular (${coords[slotIdx]?.label || 'Cancha'})` : 'Banca'}
                          </span>

                          ${
                            isAdmin
                              ? `<button type="button" onclick="togglePlayerStarter('${p.id}')" class="px-2.5 py-1 rounded-lg bg-sky-500/15 hover:bg-sky-500/25 text-sky-500 text-[10px] font-black">
                                  Cambiar Rol
                                </button>
                                <button type="button" onclick="togglePlayerInjury('${p.id}')" class="px-2.5 py-1 rounded-lg bg-red-600/15 hover:bg-red-600/25 text-red-600 dark:text-red-400 text-[10px] font-black">
                                  ${p.injured ? 'Dar Alta' : 'Lesión'}
                                </button>`
                              : ''
                          }
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectRosterTeam(teamId) {
      selectedRosterTeamId = teamId;
      renderRostersView();
    }

    function changeTeamFormation(teamId, newFormation) {
      if (!isAdmin || !FORMATIONS[newFormation]) return;
      const t = getTeamById(teamId);
      t.formation = newFormation;
      persistTournamentState(`Cambio de formación de ${t.shortName} a ${newFormation}`);
      showToast(`Formación de ${t.shortName} actualizada a ${newFormation}.`, 'success');
      renderRostersView();
    }

    function togglePlayerStarter(playerId) {
      if (!isAdmin) return;
      const p = getPlayerById(playerId);
      if (!p) return;
      const team = getTeamById(p.teamId);
      team.lineupSlots = buildNormalizedSlots(team.id, tournamentData.players, team.lineupSlots);
      const idx = team.lineupSlots.indexOf(p.id);

      if (idx !== -1) {
        team.lineupSlots[idx] = null;
      } else {
        const emptyIdx = team.lineupSlots.indexOf(null);
        if (emptyIdx !== -1) {
          team.lineupSlots[emptyIdx] = p.id;
        } else {
          team.lineupSlots[4] = p.id;
        }
      }
      syncTeamStarterFlagsFromSlots(team.id, team.lineupSlots);
      persistTournamentState(`Cambio titular/banca de ${p.name}`);
      renderRostersView();
    }

    function togglePlayerInjury(playerId) {
      if (!isAdmin) return;
      const p = getPlayerById(playerId);
      if (!p) return;

      if (p.injured) {
        p.injured = false;
        p.injuryReason = '';
        persistTournamentState(`Alta médica de ${p.name}`);
        showToast(`${p.name}: Alta médica registrada.`, 'success');
        renderRostersView();
        return;
      }

      openModal(
        `Registrar Lesión · ${p.name}`,
        `
          <form id="roster-injury-form" class="space-y-3">
            <div>
              <label class="block text-[11px] font-black uppercase text-red-500 mb-1">Razón Médica de la Lesión</label>
              <input
                id="ri-reason"
                type="text"
                maxlength="80"
                placeholder="Ej: Esguince de tobillo, sobrecarga muscular..."
                class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold"
              />
              <div class="flex flex-wrap gap-1.5 mt-2">
                ${['Sobrecarga muscular', 'Esguince de tobillo', 'Contusión / Golpe', 'Tirón muscular']
                  .map(
                    (preset) =>
                      `<button type="button" onclick="document.getElementById('ri-reason').value='${preset}'" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-red-600/15 dark:bg-slate-800 text-[10px] font-bold text-slate-600 dark:text-slate-300 transition">${preset}</button>`
                  )
                  .join('')}
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-black">Cancelar</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-black">Confirmar Lesión</button>
            </div>
          </form>
        `
      );

      setTimeout(() => {
        const inp = document.getElementById('ri-reason');
        if (inp) inp.focus();
      }, 60);

      document.getElementById('roster-injury-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const reason = (document.getElementById('ri-reason').value || '').trim();
        p.injured = true;
        p.injuryReason = reason;
        const team = getTeamById(p.teamId);
        team.lineupSlots = buildNormalizedSlots(team.id, tournamentData.players, team.lineupSlots);
        handlePlayerRemovalFromPitch(team.id, p.id, team.lineupSlots);
        syncTeamStarterFlagsFromSlots(team.id, team.lineupSlots);
        persistTournamentState(`Lesión registrada: ${p.name}${reason ? ` (${reason})` : ''}`);
        closeModal();
        showToast(`${p.name}: Marcado como lesionado${reason ? ` (${reason})` : ''}.`, 'info');
        renderRostersView();
      });
    }

    // =========================================================================
    // 14. VISTA 5 (SOLO ADMIN): PLAYOFFS & SUPERCOPA DE FRANCO
    // =========================================================================
    function renderPlayoffsView() {
      const container = document.getElementById('main-view-container');
      if (!container || !isAdmin) return;

      const standings = computeStandings();
      const s1 = standings[0] || null;
      const s2 = standings[1] || null;
      const s3 = standings[2] || null;
      const s4 = standings[3] || null;
      const po = tournamentData.playoffs;

      const getWinner = (teamA, teamB, scoreA, scoreB) => {
        if (!teamA || !teamB) return null;
        if (scoreA === '' || scoreB === '' || scoreA === null || scoreB === null) return null;
        const a = Number(scoreA);
        const b = Number(scoreB);
        if (a > b) return teamA;
        if (b > a) return teamB;
        return teamA;
      };

      const getLoser = (teamA, teamB, scoreA, scoreB) => {
        const w = getWinner(teamA, teamB, scoreA, scoreB);
        if (!w) return null;
        return w.teamId === teamA.teamId ? teamB : teamA;
      };

      const finalist1 = getWinner(s1, s4, po.semi1HomeScore, po.semi1AwayScore);
      const finalist2 = getWinner(s2, s3, po.semi2HomeScore, po.semi2AwayScore);
      const playoffChampion = getWinner(finalist1, finalist2, po.finalHomeScore, po.finalAwayScore);
      const playoffRunnerUp = getLoser(finalist1, finalist2, po.finalHomeScore, po.finalAwayScore);

      const regularChampion = s1;
      const sameDoubleChampion =
        regularChampion && playoffChampion && regularChampion.teamId === playoffChampion.teamId;
      const supercupChallenger = sameDoubleChampion ? playoffRunnerUp : playoffChampion;
      const supercupChampion = getWinner(
        regularChampion,
        supercupChallenger,
        po.supercupHomeScore,
        po.supercupAwayScore
      );

      const semi1Match =
        s1 && s4
          ? {
              homeId: s1.teamId,
              awayId: s4.teamId,
              homeScore: po.semi1HomeScore,
              awayScore: po.semi1AwayScore,
              played: po.semi1HomeScore !== '' && po.semi1AwayScore !== '',
              events: [],
            }
          : null;

      const semi2Match =
        s2 && s3
          ? {
              homeId: s2.teamId,
              awayId: s3.teamId,
              homeScore: po.semi2HomeScore,
              awayScore: po.semi2AwayScore,
              played: po.semi2HomeScore !== '' && po.semi2AwayScore !== '',
              events: [],
            }
          : null;

      const finalMatch =
        finalist1 && finalist2
          ? {
              homeId: finalist1.teamId,
              awayId: finalist2.teamId,
              homeScore: po.finalHomeScore,
              awayScore: po.finalAwayScore,
              played: po.finalHomeScore !== '' && po.finalAwayScore !== '',
              events: [],
            }
          : null;

      const supercupMatch =
        regularChampion && supercupChallenger
          ? {
              homeId: regularChampion.teamId,
              awayId: supercupChallenger.teamId,
              homeScore: po.supercupHomeScore,
              awayScore: po.supercupAwayScore,
              played: po.supercupHomeScore !== '' && po.supercupAwayScore !== '',
              events: [],
            }
          : null;

      container.innerHTML = `
        <form id="playoffs-admin-form" class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <span class="px-2 py-0.5 rounded-full bg-red-600/20 text-red-500 text-[10px] font-black uppercase tracking-wider">Acceso Exclusivo Admin</span>
              <h2 class="text-lg sm:text-xl font-black tracking-tight text-slate-900 dark:text-white mt-1">Playoffs & Supercopa de Franco</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400">Cruces automáticos según los 4 primeros puestos de la clasificación</p>
            </div>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-black shadow">
              Guardar Resultados Playoffs
            </button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Semifinales -->
            <div class="space-y-4">
              <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-3">
                <div class="flex items-center justify-between text-[11px] font-black text-emerald-500">
                  <span>SEMIFINAL 1 (1° vs 4°)</span>
                  <span>${po.semi1Date}</span>
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${s1 ? getTeamLogoSVG(s1.teamId, 26) : ''}
                    <span class="text-xs font-black truncate">${s1 ? s1.name : '1° Liga'}</span>
                  </div>
                  <input id="po-s1-h" type="number" min="0" value="${po.semi1HomeScore}" placeholder="-" class="w-12 px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-xs" />
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${s4 ? getTeamLogoSVG(s4.teamId, 26) : ''}
                    <span class="text-xs font-black truncate">${s4 ? s4.name : '4° Liga'}</span>
                  </div>
                  <input id="po-s1-a" type="number" min="0" value="${po.semi1AwayScore}" placeholder="-" class="w-12 px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-xs" />
                </div>
                ${renderMatchMVPBadgeHTML(semi1Match, 'card')}
              </div>

              <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-3">
                <div class="flex items-center justify-between text-[11px] font-black text-emerald-500">
                  <span>SEMIFINAL 2 (2° vs 3°)</span>
                  <span>${po.semi2Date}</span>
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${s2 ? getTeamLogoSVG(s2.teamId, 26) : ''}
                    <span class="text-xs font-black truncate">${s2 ? s2.name : '2° Liga'}</span>
                  </div>
                  <input id="po-s2-h" type="number" min="0" value="${po.semi2HomeScore}" placeholder="-" class="w-12 px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-xs" />
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${s3 ? getTeamLogoSVG(s3.teamId, 26) : ''}
                    <span class="text-xs font-black truncate">${s3 ? s3.name : '3° Liga'}</span>
                  </div>
                  <input id="po-s2-a" type="number" min="0" value="${po.semi2AwayScore}" placeholder="-" class="w-12 px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-xs" />
                </div>
                ${renderMatchMVPBadgeHTML(semi2Match, 'card')}
              </div>
            </div>

            <!-- Gran Final -->
            <div class="rounded-2xl bg-white dark:bg-slate-900 border-2 border-red-600/50 p-4 space-y-3 flex flex-col justify-between">
              <div class="space-y-3">
                <div class="flex items-center justify-between text-[11px] font-black text-red-600 dark:text-red-400">
                  <span>GRAN FINAL</span>
                  <span>${po.finalDate}</span>
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${finalist1 ? getTeamLogoSVG(finalist1.teamId, 28) : ''}
                    <span class="text-xs font-black truncate">${finalist1 ? finalist1.name : 'Ganador SF1'}</span>
                  </div>
                  <input id="po-fin-h" type="number" min="0" value="${po.finalHomeScore}" placeholder="-" class="w-12 px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-xs" />
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${finalist2 ? getTeamLogoSVG(finalist2.teamId, 28) : ''}
                    <span class="text-xs font-black truncate">${finalist2 ? finalist2.name : 'Ganador SF2'}</span>
                  </div>
                  <input id="po-fin-a" type="number" min="0" value="${po.finalAwayScore}" placeholder="-" class="w-12 px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-xs" />
                </div>
                ${renderMatchMVPBadgeHTML(finalMatch, 'card')}
              </div>

              <div class="p-3 rounded-xl bg-red-600/15 border border-red-500/30 text-center">
                <span class="block text-[10px] font-black uppercase text-red-600 dark:text-red-400">Campeón Playoffs</span>
                <span class="text-sm font-black text-slate-900 dark:text-white">${playoffChampion ? playoffChampion.name : 'Por definir'}</span>
              </div>
            </div>

            <!-- Supercopa de Franco -->
            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-blue-500/40 p-4 space-y-3 flex flex-col justify-between">
              <div class="space-y-3">
                <div class="flex items-center justify-between text-[11px] font-black text-blue-400">
                  <span>SUPERCOPA DE FRANCO</span>
                  <span>${po.supercupDate}</span>
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${regularChampion ? getTeamLogoSVG(regularChampion.teamId, 28) : ''}
                    <span class="text-xs font-black truncate">${regularChampion ? regularChampion.name : 'Campeón Liga'}</span>
                  </div>
                  <input id="po-sup-h" type="number" min="0" value="${po.supercupHomeScore}" placeholder="-" class="w-12 px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-xs" />
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    ${supercupChallenger ? getTeamLogoSVG(supercupChallenger.teamId, 28) : ''}
                    <span class="text-xs font-black truncate">${supercupChallenger ? supercupChallenger.name : 'Campeón Playoffs'}</span>
                  </div>
                  <input id="po-sup-a" type="number" min="0" value="${po.supercupAwayScore}" placeholder="-" class="w-12 px-2 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black text-xs" />
                </div>
                ${renderMatchMVPBadgeHTML(supercupMatch, 'card')}
              </div>

              <div class="p-3 rounded-xl bg-blue-500/15 border border-blue-500/30 text-center">
                <span class="block text-[10px] font-black uppercase text-blue-400">Supercampeón de Franco</span>
                <span class="text-sm font-black text-slate-900 dark:text-white">${supercupChampion ? supercupChampion.name : 'Por definir'}</span>
              </div>
            </div>
          </div>
        </form>
      `;

      document.getElementById('playoffs-admin-form').addEventListener('submit', (e) => {
        e.preventDefault();
        po.semi1HomeScore = document.getElementById('po-s1-h').value;
        po.semi1AwayScore = document.getElementById('po-s1-a').value;
        po.semi2HomeScore = document.getElementById('po-s2-h').value;
        po.semi2AwayScore = document.getElementById('po-s2-a').value;
        po.finalHomeScore = document.getElementById('po-fin-h').value;
        po.finalAwayScore = document.getElementById('po-fin-a').value;
        po.supercupHomeScore = document.getElementById('po-sup-h').value;
        po.supercupAwayScore = document.getElementById('po-sup-a').value;

        persistTournamentState('Actualización de Playoffs y Supercopa');
        showToast('Resultados de Playoffs y Supercopa guardados.', 'success');
        renderPlayoffsView();
      });
    }

    // =========================================================================
    // 15. VISTA 6 (SOLO ADMIN): PANEL ADMIN, TRANSMISIÓN Y PERSISTENCIA
    // =========================================================================
    function renderAdminPanelView() {
      const container = document.getElementById('main-view-container');
      if (!container || !isAdmin) return;

      const history = getHistoryList();

      container.innerHTML = `
        <div class="space-y-6">
          <div>
            <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-black uppercase tracking-wider">Control Total</span>
            <h2 class="text-lg sm:text-xl font-black tracking-tight text-slate-900 dark:text-white mt-1">Panel de Administración y Respaldos</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Inicia transmisiones en vivo, fija cambios permanentes o revierte cualquier modificación</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-4 shadow-sm">
              <h3 class="text-sm font-black text-slate-900 dark:text-white flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                Iniciar Transmisión en Vivo
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                Selecciona un partido del calendario para activar el marcador en tiempo real, quintetos en cancha, goles, sustituciones, tarjetas y lesiones.
              </p>
              <div class="space-y-3">
                <select id="admin-live-match-select" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-xs font-bold">
                  ${tournamentData.matches
                    .map((m) => {
                      const h = getTeamById(m.homeId);
                      const a = getTeamById(m.awayId);
                      return `<option value="${m.id}">J${m.round} (${m.date}) · ${h.name} vs ${a.name} ${m.played ? `[${m.homeScore}-${m.awayScore}]` : ''}</option>`;
                    })
                    .join('')}
                </select>
                <button type="button" onclick="launchSelectedLiveMatch()" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-black shadow">
                  Activar Transmisión en Vivo
                </button>
              </div>
            </div>

            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-4 shadow-sm">
              <h3 class="text-sm font-black text-slate-900 dark:text-white">Cambio Permanente y Puntos de Restauración</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                Todos tus cambios se guardan automáticamente. Puedes fijar el estado actual como <strong>Cambio Permanente</strong> o revertir en cualquier momento.
              </p>
              <div class="flex flex-col sm:flex-row gap-2">
                <button type="button" onclick="saveAsPermanentState()" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black shadow">
                  Guardar Todo como Cambio Permanente
                </button>
                <button type="button" onclick="undoLastChange()" class="py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs font-black">
                  Deshacer Último
                </button>
                <button type="button" onclick="revertToPermanentState()" class="py-2.5 px-3 rounded-xl bg-red-600/20 hover:bg-red-600/30 text-red-600 dark:text-red-400 border border-red-500/40 text-xs font-black">
                  Revertir a Permanente
                </button>
              </div>
            </div>
          </div>

          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-3 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h3 class="text-sm font-black text-slate-900 dark:text-white">Seguridad de Acceso (PIN Cifrado SHA-256)</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">
                  El PIN nunca se almacena en el código fuente ni en texto plano. Puedes personalizar tu clave con cifrado SHA-256 con sal aleatoria.
                </p>
              </div>
              <button type="button" onclick="openChangeAdminPinModal()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white text-xs font-black shrink-0">
                Cambiar PIN Admin
              </button>
            </div>
          </div>

          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">
            <div class="px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <h3 class="text-sm font-black text-slate-900 dark:text-white">Historial de Cambios del Administrador</h3>
              <span class="text-[11px] font-bold text-slate-400">${history.length} puntos guardados</span>
            </div>
            <div class="divide-y divide-slate-100 dark:divide-slate-800 max-h-72 overflow-y-auto">
              ${
                history.length
                  ? history
                      .map(
                        (snap) => `
                    <div class="px-5 py-3 flex items-center justify-between gap-3">
                      <div class="min-w-0">
                        <p class="text-xs font-extrabold text-slate-900 dark:text-white truncate">${snap.label}</p>
                        <p class="text-[10px] font-bold text-slate-400">${snap.timestamp}</p>
                      </div>
                      <button type="button" onclick="revertToHistorySnapshot('${snap.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-red-600 hover:text-white dark:bg-slate-800 text-xs font-black shrink-0 transition">
                        Revertir aquí
                      </button>
                    </div>
                  `
                      )
                      .join('')
                  : `<p class="p-5 text-xs text-slate-400">Aún no hay puntos históricos registrados en esta sesión.</p>`
              }
            </div>
          </div>
        </div>
      `;
    }

    function launchSelectedLiveMatch() {
      const sel = document.getElementById('admin-live-match-select');
      if (!sel) return;
      startLiveFromMatch(sel.value);
    }

    function openChangeAdminPinModal() {
      if (!isAdmin) return;
      openModal(
        'Actualizar PIN de Administrador',
        `
          <form id="change-pin-form" class="space-y-3">
            <p class="text-xs text-slate-500 dark:text-slate-400">
              El nuevo PIN se protegerá mediante resumen criptográfico <strong>SHA-256 con sal aleatoria</strong> y nunca se guardará en texto visible.
            </p>
            <div>
              <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">Nuevo PIN (4 a 8 dígitos)</label>
              <input id="new-admin-pin" type="password" inputmode="numeric" minlength="4" maxlength="8" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black tracking-[0.3em]" />
            </div>
            <div>
              <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">Confirmar Nuevo PIN</label>
              <input id="confirm-admin-pin" type="password" inputmode="numeric" minlength="4" maxlength="8" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-center font-black tracking-[0.3em]" />
            </div>
            <div class="flex items-center justify-between gap-2 pt-2">
              <button type="button" onclick="resetDefaultAdminPin()" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-[11px] font-black text-slate-500">
                Restaurar PIN Inicial
              </button>
              <div class="flex gap-2">
                <button type="button" onclick="closeModal()" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-black">Cancelar</button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-black">Guardar PIN</button>
              </div>
            </div>
          </form>
        `
      );

      document.getElementById('change-pin-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = (document.getElementById('new-admin-pin').value || '').trim();
        const p2 = (document.getElementById('confirm-admin-pin').value || '').trim();
        if (p1.length < 4 || p1 !== p2) {
          showToast('Los PIN ingresados no coinciden o son muy cortos.', 'error');
          return;
        }
        try {
          const saltBytes = new Uint8Array(16);
          crypto.getRandomValues(saltBytes);
          const salt = Array.from(saltBytes)
            .map((b) => b.toString(16).padStart(2, '0'))
            .join('');
          const digest = await sha256Hex(`${salt}:${p1}`);
          localStorage.setItem(STORAGE_ADMIN_AUTH_KEY, JSON.stringify({ salt, digest }));
          closeModal();
          showToast('Nuevo PIN cifrado con SHA-256 guardado.', 'success');
        } catch (err) {
          showToast('No se pudo cifrar el PIN en este navegador.', 'error');
        }
      });
    }

    function resetDefaultAdminPin() {
      if (!isAdmin) return;
      localStorage.removeItem(STORAGE_ADMIN_AUTH_KEY);
      closeModal();
      showToast('Se restauró el PIN oficial inicial.', 'info');
    }

    // =========================================================================
    // 16. RENDERIZADO PRINCIPAL E INICIALIZACIÓN AL CARGAR LA VENTANA
    // =========================================================================
    function renderApp() {
      recalculatePlayerStats();
      renderNavigation();
      renderLiveBanner();

      if (activeTab === 'standings') {
        renderStandingsView();
      } else if (activeTab === 'matches') {
        renderMatchesView();
      } else if (activeTab === 'stats') {
        renderStatsView();
      } else if (activeTab === 'rosters') {
        renderRostersView();
      } else if (activeTab === 'playoffs' && isAdmin) {
        renderPlayoffsView();
      } else if (activeTab === 'admin' && isAdmin) {
        renderAdminPanelView();
      } else {
        activeTab = 'standings';
        renderStandingsView();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();

      const headerLogo = document.getElementById('league-logo-header');
      if (headerLogo) {
        headerLogo.innerHTML = getLeagueLogoSVG(54);
      }

      const btnTheme = document.getElementById('btn-toggle-theme');
      if (btnTheme) {
        btnTheme.addEventListener('click', toggleTheme);
      }

      const btnAdmin = document.getElementById('btn-admin-access');
      if (btnAdmin) {
        btnAdmin.addEventListener('click', openAdminPinModal);
      }

      const btnCloseModal = document.getElementById('app-modal-close');
      if (btnCloseModal) {
        btnCloseModal.addEventListener('click', closeModal);
      }

      const modalOverlay = document.getElementById('app-modal');
      if (modalOverlay) {
        modalOverlay.addEventListener('click', (e) => {
          if (e.target === modalOverlay) closeModal();
        });
      }

      startLiveClockInterval();
      renderApp();
    });
  </script>
</body>
</html>
